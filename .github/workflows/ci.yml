name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips the native build of isolated-vm (pulled transitively
        # by n8n-workflow's expression runtime). It is never exercised by lint/build/test.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript verification)
        run: npm run build

      - name: Test
        run: npm test
